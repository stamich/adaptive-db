# Manually started workload benchmark at a chosen scale factor. The gate usually says `diagnostic`
# here (no `performance` governor on a hosted runner): exit codes 3 and 4 are accepted. Hosted runners are shared
# machines: use the results for consistency checks and rough trends, and record reference
# numbers on dedicated hardware (see examples/results/README.md).
name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      scale:
        description: Scale factor (1 = 324k rows, 10 = 3.2M rows)
        required: true
        default: "10"
        type: choice
        options: ["1", "10"]
      quick:
        description: Quick measurement plan (a smoke run, not release grade)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Workload benchmark (scale ${{ inputs.scale }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ADB_BENCH_SCALE: ${{ inputs.scale }}
      ADB_BENCH_QUICK: ${{ inputs.quick && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "22"
      - uses: gradle/actions/setup-gradle@v6
      - name: rust_native
        run: ./scripts/benchmark-db.sh || { c=$?; [ $c -eq 3 ] || [ $c -eq 4 ]; }
        env:
          ADB_BENCH_OUT: ${{ runner.temp }}/2.5.4.1-database.json
      - name: JVM paths
        run: ./scripts/benchmark-ffi.sh || { c=$?; [ $c -eq 3 ] || [ $c -eq 4 ]; }
        env:
          ADB_BENCH_OUT: ${{ runner.temp }}/2.5.4.1-ffi.json
      - name: Check consistency
        run: python3 scripts/check-benchmarks.py "$RUNNER_TEMP/2.5.4.1-database.json" "$RUNNER_TEMP/2.5.4.1-ffi.json"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-results-sf${{ inputs.scale }}
          path: ${{ runner.temp }}/2.5.4.1-*.json
          if-no-files-found: ignore
