# Continuous integration: the checks of build-milestone-2.5.4.1.sh, split into jobs.
#
#   rust         format, lints (incl. documentation of every item), tests, rustdoc, C header
#   jvm          Gradle wrapper validation, Scala/Java compile (-Werror) and tests
#   bench-tools  unit tests of the benchmark scripts (gates, repeat, A/B, compare) and the report
#                validator on every committed report
#   integration  Java FFM -> C ABI -> engine smoke test, Rust demo, JVM feature tour, and the quick
#                benchmark plan whose reports are validated and checked for consistency (never for
#                speed: hosted runners have no `performance` governor, so the gate says `diagnostic`
#                and the steps accept exit codes 3 and 4)
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (incl. missing docs)
        run: cargo clippy --workspace --all-targets -- -D warnings -W missing_docs -W clippy::missing_docs_in_private_items
      - name: Tests
        run: cargo test --workspace
      - name: Rustdoc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: C header compiles
        run: gcc -fsyntax-only -Wall -Werror -x c include/adb.h

  bench-tools:
    name: Benchmark tools
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Script tests
        run: python3 -m unittest discover -s scripts/tests
      - name: Validate committed reports
        run: python3 scripts/bench_validate.py examples/results/*.json

  jvm:
    name: JVM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "22"
      - uses: gradle/actions/setup-gradle@v6
      - name: Compile and test (Scala -Werror, Java)
        working-directory: jvm
        run: ./gradlew --no-daemon clean test
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jvm-test-reports
          path: jvm/**/build/reports/tests/
          if-no-files-found: ignore

  integration:
    name: Integration
    needs: [rust, jvm]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ADB_BENCH_QUICK: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "22"
      - uses: gradle/actions/setup-gradle@v6
      - name: Native library (release)
        run: cargo build --release -p adb-ffi
      - name: Java FFM -> C ABI v9 smoke test
        run: ./examples/jvm-cdc-smoke/run.sh
      - name: Rust relational demo
        run: cargo run --release -p adb-rust-demo
      - name: JVM feature tour
        run: ./demo/run-demo.sh
      - name: Workload benchmark, rust_native (scale 1)
        # exit 3 (unstable) and 4 (diagnostic) only say how far the numbers can be trusted
        run: ./scripts/benchmark-db.sh || { c=$?; [ $c -eq 3 ] || [ $c -eq 4 ]; }
        env:
          ADB_BENCH_OUT: ${{ runner.temp }}/2.5.4.1-database.json
      - name: Workload benchmark, JVM paths (scale 1)
        run: ./scripts/benchmark-ffi.sh || { c=$?; [ $c -eq 3 ] || [ $c -eq 4 ]; }
        env:
          ADB_BENCH_OUT: ${{ runner.temp }}/2.5.4.1-ffi.json
      - name: Validate benchmark reports
        run: python3 scripts/bench_validate.py --require-schema "$RUNNER_TEMP/2.5.4.1-database.json" "$RUNNER_TEMP/2.5.4.1-ffi.json"
      - name: Check benchmark consistency
        run: python3 scripts/check-benchmarks.py "$RUNNER_TEMP/2.5.4.1-database.json" "$RUNNER_TEMP/2.5.4.1-ffi.json"
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: ${{ runner.temp }}/2.5.4.1-*.json
          if-no-files-found: ignore
