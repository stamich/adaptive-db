[workspace]
members = [
    "crates/adb-core",
    "crates/adb-journal",
    "crates/adb-page",
    "crates/adb-buffer",
    "crates/adb-btree",
    "crates/adb-index",
    "crates/adb-schema",
    "crates/adb-wal",
    "crates/adb-storage",
    "crates/adb-tx",
    "crates/adb-engine",
    "crates/adb-execution",
    "crates/adb-stats",
    "crates/adb-plan-wire",
    "crates/adb-ffi",
    "crates/adb-migrate",
    "examples/rust-benchmark",
    "examples/rust-demo",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "2.4.0"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
crc32fast = "1.4"
parking_lot = "0.13"
tempfile = "3"

serde_json = "1"
