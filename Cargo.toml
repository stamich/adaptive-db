[workspace]
members = [
    "crates/adb-core",
#    "crates/adb-wal",
    "crates/adb-storage",
#    "crates/adb-tx",
#    "crates/adb-engine",
]
resolver = "2"

[workspace.package]
name = "adaptive-db"
version = "0.1.0"
edition = "2024"
license = "GPL"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
crc32fast = "1.4"
parking_lot = "0.12"
tempfile = "3"
