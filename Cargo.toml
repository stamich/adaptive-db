[workspace]
members = [
    "crates/adb-core",
    "crates/adb-page",
    "crates/adb-buffer",
    "crates/adb-btree",
    "crates/adb-wal",
    "crates/adb-storage",
    "crates/adb-tx",
    "crates/adb-engine",
    "examples/demo",
    "examples/benchmark",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.6+examples.2"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
crc32fast = "1.4"
parking_lot = "0.12"
tempfile = "3"
